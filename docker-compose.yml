services:
  minimaker:
    build: .
    volumes:
      - staticfiles:/app/static
    stdin_open: true
    tty: true
    environment:
      - PRODUCTION=False
      - DJANGO_SECRET_KEY=asdfmovie
    ports:
      - "8080:8080"
  postgres:
    image: postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
  web:
    image: nginx
    volumes:
      - ./nginx:/etc/nginx/conf.d
      - staticfiles:/static
    ports:
      - "80:80"

volumes:
  staticfiles:
